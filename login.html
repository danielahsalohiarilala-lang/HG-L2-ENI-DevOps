{% extends "base.html" %}
{% block title %}Connexion - Plateforme Malgache{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow border-0 rounded-4 p-4">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark">Connexion</h3>
                <p class="text-muted">Accédez à votre espace de gestion du corpus</p>
            </div>
            <form action="/auth/login" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Nom d'utilisateur</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" required placeholder="Ex: admin">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Se connecter</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
